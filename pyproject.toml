[project]
name = "fleetalert-mcp"
version = "0.2.0"
description = "MCP server for FleetAlert AI: typed tools over the live agent API, with safety tiers, bearer-token auth and rate limits"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Michael Golden", email = "mbgolden66@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
lambda = [
    "boto3>=1.35",
    "mangum>=0.22",
]

[project.urls]
Homepage = "https://github.com/mbgolden/fleetalert-mcp"
"FleetAlert AI" = "https://fleetalert.10finger.dev"

[project.scripts]
fleetalert-mcp = "fleetalert_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.7",
    "mangum>=0.22",
    "boto3>=1.35",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "mangum", "mangum.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real FleetAlert API (set FLEETALERT_MCP_LIVE=1 to run)",
]
